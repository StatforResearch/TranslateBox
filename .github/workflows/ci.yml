name: Validate TranslateBox
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/unit_tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the deployment
        env:
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          OPERATOR_TOKEN: ci-operator-token-placeholder-32-characters
          CORS_ORIGINS: http://localhost
          SITE_ADDRESS: http://localhost
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost/api/health
          curl --fail http://localhost/e/smoke-test | grep 'TranslateBox Live'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' http://localhost/api/events)" = '401'
      - if: always()
        run: docker compose logs --no-color || true
        env:
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          OPERATOR_TOKEN: ci-operator-token-placeholder-32-characters
          CORS_ORIGINS: http://localhost
