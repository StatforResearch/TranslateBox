services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN in .env}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-translate}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact public origin}
      # Backend is accessible only on the private Compose network.
      FORWARDED_ALLOW_IPS: '*'
      MAX_LISTENERS: ${MAX_LISTENERS:-30}
    expose:
      - '8001'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
